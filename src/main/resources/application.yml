server:
  port: 8085

spring:
  application:
    name: ecommerce
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/shaantroop_db}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:your_secure_password}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    jwt:
      secret-key: "${JWT_SECRET}"
      expiration: "${JWT_EXPIRATION}"

app:
  admin:
    email: "${ADMIN_EMAIL}"
    password: "${ADMIN_PASSWORD}"
  google:
    client-id: "${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://192.168.1.3:3000}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always